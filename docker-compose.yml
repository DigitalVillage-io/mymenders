# Local PostgreSQL for development. Load data with scripts/db-restore.sh.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mymender
      POSTGRES_PASSWORD: mymender
      POSTGRES_DB: mymender
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymender -d mymender"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
